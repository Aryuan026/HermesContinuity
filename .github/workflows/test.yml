name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Checkout predecessor request-overlay unit host
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: fcbd1076a93841fa88855acce810e342a5b78101
          path: _upstream/hermes
          fetch-depth: 1
      - name: Materialize predecessor request-overlay unit host
        run: |
          for patch in \
            hermes-0.20.5-plugin-llm-finish-reason.patch \
            hermes-0.20.5-request-middleware-v2.patch \
            hermes-0.20.5-plugin-service-registry.patch \
            hermes-0.20.5-bounded-session-message-reads.patch \
            hermes-0.20.5-provider-transport-truth.patch \
            hermes-0.20.5-closed-finish-state-truth.patch \
            hermes-0.20.5-final-provider-budget-controls.patch \
            hermes-0.20.5-verified-wakeup-provenance.patch \
            hermes-0.20.5-installer-manifest-v2.patch \
            hermes-0.20.5-joint-plugin-doctor.patch \
            hermes-0.20.5-request-overlay-proofs.patch \
            hermes-0.20.5-request-overlay-acceptance.patch
          do
            git -C "$GITHUB_WORKSPACE/_upstream/hermes" apply "$GITHUB_WORKSPACE/patches/$patch"
          done
          cp "$GITHUB_WORKSPACE/tests/host_contract/message_origin.py" "$GITHUB_WORKSPACE/_upstream/hermes/agent/message_origin.py"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/_upstream/hermes" >> "$GITHUB_ENV"
      - name: Install unit-test runtime
        run: python -m pip install -e "$GITHUB_WORKSPACE/_upstream/hermes" pytest==9.1.1
      - name: Verify predecessor request overlay seam
        run: |
          cd "$GITHUB_WORKSPACE/_upstream/hermes"
          python -B -m pytest -q tests/test_request_overlay.py tests/test_middleware.py
      - name: Run plugin unit suite
        run: python -B -m unittest discover -s tests -v
