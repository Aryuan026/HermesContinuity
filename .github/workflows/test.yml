name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CONTINUITY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      GLOBAL_HOT_REF: 01918856aa46f80ca17dd67d079eed1b7261f85f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTINUITY_REF }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Checkout pure Hermes 0.21.0
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 29112bef099274229cadff79cdff7bf7b99c4b77
          path: _upstream/hermes
          fetch-depth: 1
      - name: Checkout accepted Global Hot
        uses: actions/checkout@v4
        with:
          repository: Aryuan026/HermesGlobalHot
          ref: 01918856aa46f80ca17dd67d079eed1b7261f85f
          path: _paired/global-hot
          fetch-depth: 1
      - name: Materialize exact Hermes 0.21 host
        run: |
          python scripts/materialize_hermes_021.py --host "$GITHUB_WORKSPACE/_upstream/hermes"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/_upstream/hermes" >> "$GITHUB_ENV"
          echo "HERMES_SOURCE_ROOT=$GITHUB_WORKSPACE/_upstream/hermes" >> "$GITHUB_ENV"
          echo "HERMES_CONTINUITY_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "HERMES_GLOBAL_HOT_ROOT=$GITHUB_WORKSPACE/_paired/global-hot" >> "$GITHUB_ENV"
      - name: Install exact host test runtime
        run: python -m pip install -e "$GITHUB_WORKSPACE/_upstream/hermes[dev,messaging,acp,anthropic]"
      - name: Run accepted host seam matrix
        run: |
          cd "$GITHUB_WORKSPACE/_upstream/hermes"
          python -B -m pytest -q \
            @"$GITHUB_WORKSPACE/tests/host_contract/wave7_host_tests.txt" \
            --deselect=tests/agent/test_auxiliary_client.py::TestAuxiliaryAuthRefreshRetry::test_refresh_provider_credentials_force_refreshes_anthropic_oauth_and_evicts_cache
      - name: Run Continuity suite
        run: python -B -m unittest discover -s tests -v
      - name: Run Global Hot suite
        run: |
          cd "$HERMES_GLOBAL_HOT_ROOT"
          python -B -m unittest discover -s tests -v
      - name: Run paired production entrypoint
        run: python -B tests/test_real_host_entrypoint.py -v
      - name: Verify exact disabled lifecycle
        run: |
          python scripts/verify_wave7_lifecycle.py \
            --continuity-repo "$GITHUB_WORKSPACE" \
            --continuity-ref "$CONTINUITY_REF" \
            --global-hot-repo "$HERMES_GLOBAL_HOT_ROOT" \
            --global-hot-ref "$GLOBAL_HOT_REF"
